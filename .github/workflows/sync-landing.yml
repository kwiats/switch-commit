name: Sync landing

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-landing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Sync changelog and download CTA
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          POLAR_CHECKOUT_URL: ${{ vars.POLAR_CHECKOUT_URL }}
        run: node Scripts/site-landing/sync-landing.mjs

      - name: Open PR if landing changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- site/index.html; then
            echo "No landing changes."
            exit 0
          fi
          default_branch="${{ github.event.repository.default_branch }}"
          branch="automation/sync-landing-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add site/index.html
          git commit -m "Sync landing changelog and download CTA."
          git push -u origin "HEAD:${branch}"
          gh pr create \
            --base "${default_branch}" \
            --head "${branch}" \
            --title "Sync landing changelog and download CTA" \
            --body "Automated landing sync from GitHub Releases."
          gh pr merge --merge --auto "${branch}" || gh pr merge --merge "${branch}"
