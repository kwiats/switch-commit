name: Release Channel

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-release-channel:
    name: Build and publish release channel
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source repository
        uses: actions/checkout@v7

      - name: Validate tag version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ "${tag}" == "${version}" || ! "${version}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Expected a vX.Y.Z tag, got ${tag}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Show Swift version
        run: swift --version

      - name: Run PR checks
        run: Scripts/pr-checks.sh

      - name: Build release artifacts
        run: Scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release and site metadata
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: Scripts/publish-release-channel.sh "${{ steps.version.outputs.version }}" "$PWD"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Sync DMG to Polar
        env:
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_ORGANIZATION_ID: ${{ secrets.POLAR_ORGANIZATION_ID }}
          POLAR_BENEFIT_ID: ${{ secrets.POLAR_BENEFIT_ID }}
        run: >
          node Scripts/polar-sync-dmg.mjs
          --dmg "dist/v${{ steps.version.outputs.version }}/SwitchCommit-v${{ steps.version.outputs.version }}-macOS.dmg"
          --version "${{ steps.version.outputs.version }}"

      - name: Sync landing changelog and download CTA
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          POLAR_CHECKOUT_URL: ${{ vars.POLAR_CHECKOUT_URL }}
        run: node Scripts/site-landing/sync-landing.mjs

      - name: Open PR with site metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          default_branch="${{ github.event.repository.default_branch }}"
          branch="automation/release-site-v${version}"
          staging="$(mktemp -d)"
          cp site/appcast.xml site/version.txt site/index.html "${staging}/"

          # Ignore user/global Git config that may rewrite GitHub HTTPS to SSH
          # (for example managed Switch Commit url.insteadOf / core.sshCommand).
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_SYSTEM=/dev/null
          unset GIT_SSH_COMMAND || true

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            fetch origin "${default_branch}"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            checkout -B "${branch}" "origin/${default_branch}"
          mkdir -p site
          cp "${staging}/appcast.xml" site/appcast.xml
          cp "${staging}/version.txt" site/version.txt
          cp "${staging}/index.html" site/index.html
          git add site/appcast.xml site/version.txt site/index.html
          if git diff --cached --quiet; then
            echo "No site metadata changes to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Release Switch Commit v${version} channel metadata"
          git push -u origin "HEAD:${branch}" --force
          if gh pr list --head "${branch}" --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create \
              --base "${default_branch}" \
              --head "${branch}" \
              --title "Release site metadata for v${version}" \
              --body "Automated Sparkle \`site/appcast.xml\`, \`site/version.txt\`, and landing changelog/CTA update for tag \`v${version}\`."
          fi
          gh pr merge --merge --auto "${branch}" || gh pr merge --merge "${branch}"
          gh workflow run "Deploy GitHub Pages" --repo "${GITHUB_REPOSITORY}" --ref "${default_branch}" \
            || echo "Warning: could not dispatch Pages deploy; run it manually if needed."

  publish-linux-cli:
    name: Publish Linux CLI binary
    runs-on: ubuntu-latest
    needs: publish-release-channel

    steps:
      - name: Check out source repository
        uses: actions/checkout@v7

      - name: Install Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Show Swift version
        run: swift --version

      - name: Build Linux CLI release asset
        run: Scripts/build-cli-release.sh "${{ needs.publish-release-channel.outputs.version }}"

      - name: Upload Linux CLI asset to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.publish-release-channel.outputs.version }}"
          gh release upload "v${version}" \
            "dist/v${version}/switch-commit-linux-x86_64" \
            "dist/v${version}/switch-commit-linux-x86_64.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  publish-windows-cli:
    name: Publish Windows CLI binary (experimental)
    runs-on: windows-latest
    needs: publish-release-channel
    continue-on-error: true

    steps:
      - name: Check out source repository
        uses: actions/checkout@v7

      - name: Install Swift 6.2 (Windows)
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE

      - name: Show Swift version
        shell: bash
        run: swift --version

      - name: Build Windows CLI release asset
        shell: bash
        run: Scripts/build-cli-release.sh "${{ needs.publish-release-channel.outputs.version }}"

      - name: Upload Windows CLI asset to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${{ needs.publish-release-channel.outputs.version }}"
          gh release upload "v${version}" \
            "dist/v${version}/switch-commit-windows-x86_64.exe" \
            "dist/v${version}/switch-commit-windows-x86_64.exe.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
