name: Release Channel

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release-channel:
    name: Build and publish release channel
    runs-on: macos-latest

    steps:
      - name: Check out source repository
        uses: actions/checkout@v7

      - name: Validate tag version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ "${tag}" == "${version}" || ! "${version}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Expected a vX.Y.Z tag, got ${tag}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Show Swift version
        run: swift --version

      - name: Run PR checks
        run: Scripts/pr-checks.sh

      - name: Build release artifacts
        run: Scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release and site metadata
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: Scripts/publish-release-channel.sh "${{ steps.version.outputs.version }}" "$PWD"

      - name: Push site metadata to default branch
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          staging="$(mktemp -d)"
          cp site/appcast.xml site/version.txt "${staging}/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout -B "${{ github.event.repository.default_branch }}" "origin/${{ github.event.repository.default_branch }}"
          mkdir -p site
          cp "${staging}/appcast.xml" site/appcast.xml
          cp "${staging}/version.txt" site/version.txt
          git add site/appcast.xml site/version.txt
          if git diff --cached --quiet; then
            echo "No site metadata changes to publish."
            exit 0
          fi
          git commit -m "Release Switch Commit v${version} channel metadata"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
