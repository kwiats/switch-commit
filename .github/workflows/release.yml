name: Release Channel

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-release-channel:
    name: Build and publish release channel
    runs-on: macos-latest

    steps:
      - name: Check out source repository
        uses: actions/checkout@v7

      - name: Validate tag version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ "${tag}" == "${version}" || ! "${version}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Expected a vX.Y.Z tag, got ${tag}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Show Swift version
        run: swift --version

      - name: Run PR checks
        run: Scripts/pr-checks.sh

      - name: Build release artifacts
        run: Scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release and site metadata
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: Scripts/publish-release-channel.sh "${{ steps.version.outputs.version }}" "$PWD"

      - name: Open PR with site metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          default_branch="${{ github.event.repository.default_branch }}"
          branch="automation/release-site-v${version}"
          staging="$(mktemp -d)"
          cp site/appcast.xml site/version.txt "${staging}/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${default_branch}"
          git checkout -B "${branch}" "origin/${default_branch}"
          mkdir -p site
          cp "${staging}/appcast.xml" site/appcast.xml
          cp "${staging}/version.txt" site/version.txt
          git add site/appcast.xml site/version.txt
          if git diff --cached --quiet; then
            echo "No site metadata changes to publish."
            exit 0
          fi
          git commit -m "Release Switch Commit v${version} channel metadata"
          git push -u origin "HEAD:${branch}" --force
          if gh pr list --head "${branch}" --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create \
              --base "${default_branch}" \
              --head "${branch}" \
              --title "Release site metadata for v${version}" \
              --body "Automated Sparkle \`site/appcast.xml\` + \`site/version.txt\` update for tag \`v${version}\`."
          fi
          gh pr merge --merge --auto "${branch}" || gh pr merge --merge "${branch}"
