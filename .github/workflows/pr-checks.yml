name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run PR checks
        run: Scripts/pr-checks.sh

  linux-cli-docker-smoke:
    name: Linux CLI Docker smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Install Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Show Swift version
        run: swift --version

      - name: Build Linux switch-commit
        run: swift build -c release --product switch-commit

      - name: Run Docker Linux CLI smoke
        run: Scripts/docker/cli-linux-smoke.sh

  windows-cli-build:
    name: Windows CLI build (experimental)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Swift 6.2 (Windows)
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE

      - name: Show Swift version
        shell: bash
        run: swift --version

      - name: Build switch-commit
        shell: bash
        run: swift build --product switch-commit

