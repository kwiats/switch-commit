name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run PR checks
        run: Scripts/pr-checks.sh

